<style>
/* Layout: a single full-width poster diagram; scrolls sideways below ~1500px. */
:root {
  --bg: #f4f6f9; --panel: #ffffff; --tint: #eaeff6; --region: #f0f3f8;
  --ink: #1a2130; --muted: #5a6476; --line: #c6cdd9;
  --accent: #9a6a0c; --accent-soft: #f6ecd6; --core-soft: #e3ebf7; --core-line: #6d86ad;
  --warn: #9a5b12; --warn-soft: #f7ead8;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f131a; --panel: #171c26; --tint: #131925; --region: #121720; --ink: #e5e8ee; --muted: #9ba4b5; --line: #343d4e;
    --accent: #dcae4d; --accent-soft: #33290f; --core-soft: #1a2436; --core-line: #7e9bc8; --warn: #e2a35a; --warn-soft: #2e2313; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f131a; --panel: #171c26; --tint: #131925; --region: #121720; --ink: #e5e8ee; --muted: #9ba4b5; --line: #343d4e;
  --accent: #dcae4d; --accent-soft: #33290f; --core-soft: #1a2436; --core-line: #7e9bc8; --warn: #e2a35a; --warn-soft: #2e2313; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 8px;
}
.wrap { height: 100%; width: 100%; display: flex; align-items: center; justify-content: center; }
svg { display: block; width: 100%; height: 100%; color: var(--muted); }
.t { fill: var(--ink); font-family: var(--body); font-size: 13px; }
.tb { fill: var(--ink); font-family: var(--body); font-size: 14.5px; font-weight: 600; }
.ts { fill: var(--muted); font-family: var(--body); font-size: 12px; }
.tl { fill: var(--muted); font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; }
.ta { fill: var(--muted); font-family: var(--body); font-size: 11.5px; }
.title { fill: var(--ink); font-family: var(--display); font-size: 26px; font-weight: 600; }
.reg { fill: var(--region); stroke: var(--line); stroke-width: 1.4; stroke-dasharray: 2 4; }
.eks { fill: var(--tint); stroke: var(--line); stroke-width: 1.4; }
.ns { fill: var(--panel); stroke: var(--ink); stroke-width: 1.4; }
.box { fill: var(--panel); stroke: var(--line); stroke-width: 1.2; }
.mod { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1; }
.core { fill: var(--core-soft); stroke: var(--core-line); stroke-width: 1; }
.db { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
.plan { fill: var(--panel); stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 6 4; }
.ln { stroke: currentColor; stroke-width: 1.5; fill: none; }
.ln.dash { stroke-dasharray: 6 4; }
.ln.bus { stroke: var(--ink); stroke-width: 2.4; }
.mk { fill: currentColor; }
.pkt { fill: var(--accent); stroke: var(--panel); stroke-width: 2; }
.trail { fill: none; stroke: var(--accent); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; opacity: 0.55; }
.hl { fill: var(--accent); fill-opacity: 0.08; stroke: var(--accent); stroke-width: 3; animation: hl-pulse 1.4s ease-in-out infinite; }
@keyframes hl-pulse { 50% { stroke-opacity: 0.35; } }
.scale { opacity: 0.3; transition: opacity 0.8s ease; }
.scale.on { opacity: 1; }

/* Page: diagram on top, step bar below */
body { display: flex; flex-direction: column; gap: 8px; }
.wrap { flex: 1; min-height: 0; height: auto; }
.bar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px;
}
.flows { display: flex; flex-wrap: wrap; gap: 6px; }
.flows button, .ctl button {
  font: 500 13px var(--body); color: var(--ink); background: var(--bg); border: 1px solid var(--line);
  border-radius: 999px; padding: 5px 12px; cursor: pointer;
}
.flows button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--panel); }
.flows button:focus-visible, .ctl button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.step { flex: 1; min-width: 260px; display: grid; gap: 2px; }
.step .count { font: 11px var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); }
.step .text { font-size: 15px; color: var(--ink); }
.ctl { display: flex; gap: 6px; }
@media (prefers-reduced-motion: reduce) { .hl { animation: none; } }

/* Layout: explanation panel on the left, diagram on the right */
body { display: block; }
.layout { display: flex; gap: 14px; height: 100%; }
.wrap { flex: 1; min-width: 0; height: 100%; }
.side {
  width: 380px; flex: none; height: 100%; display: flex; flex-direction: column; gap: 12px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px;
}
.side-head { display: grid; gap: 4px; }
.side-head .count { font: 11px var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); }
.side-head h2 { margin: 0; font: 600 22px/1.2 var(--display); color: var(--ink); text-wrap: balance; }
.side-head p { margin: 0; font-size: 14px; line-height: 1.5; color: var(--muted); }
.steps { list-style: none; margin: 0; padding: 0 4px 0 0; flex: 1; min-height: 0; overflow-y: auto; display: grid; gap: 4px; align-content: start; }
.steps button {
  width: 100%; text-align: left; display: grid; grid-template-columns: 26px 1fr; gap: 10px;
  background: none; border: 1px solid transparent; border-radius: 8px; padding: 8px; cursor: pointer; color: var(--ink); font: inherit;
}
.steps button:hover { background: var(--bg); }
.steps button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.steps .n {
  width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center;
  font: 12px var(--mono); color: var(--muted); border: 1px solid var(--line); background: var(--bg);
}
.steps .body { display: grid; gap: 3px; min-width: 0; }
.steps b { font-size: 14px; font-weight: 600; color: var(--ink); }
.steps .d { font-size: 13px; line-height: 1.5; color: var(--muted); }
.steps li:not(.cur) .d { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
.steps li.done .n { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.steps li.cur button { background: var(--accent-soft); border-color: var(--accent); }
.steps li.cur .n { background: var(--accent); border-color: var(--accent); color: var(--panel); }
.steps li.cur .d { color: var(--ink); }
.side .ctl { display: flex; gap: 6px; }
.side .ctl button { flex: 1; }
.side .flows button { font-size: 12px; padding: 4px 10px; }
@media (max-width: 900px) {
  body { overflow: auto; }
  .layout { flex-direction: column; height: auto; }
  .side { width: auto; height: auto; }
  .steps { max-height: 320px; }
  .wrap { height: 70vh; }
}
.steps .tt { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.tbp { font: 10.5px var(--mono); letter-spacing: 0.04em; text-transform: uppercase; color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn); border-radius: 999px; padding: 0 7px; }
.steps .todo { display: none; font-size: 12.5px; line-height: 1.45; color: var(--warn); border-left: 2px solid var(--warn); padding-left: 8px; margin-top: 2px; }
.steps li.cur .todo { display: block; }
.side-head .ftodo { font-size: 12.5px; color: var(--warn); }
</style>

<script>
(function () {
  const TO_ABH_WEB = "L450,210 L450,330 L80,330 L80,616 L90,616";
  const FLOWS = [
    { name: "Bill at the showroom",
      about: "A sale touches pricing, tax, stock, payment and accounts. In MeghaOS they all run on one server, against one database, in one transaction.",
      steps: [
      { box: [30,90,332,70], title: "Bill saved at the till", todo: "The Electron POS till is designed but not built.",
        text: "The salesperson scans each tag on the Electron POS till. The till holds no business logic. It sends the bill to Abhushan's server and waits for the answer." },
      { path: "M196,160 L196,210", box: [30,188,1740,44], title: "HTTPS to the load balancer",
        text: "The request is encrypted (TLS) and carries the user's login token (JWT). The AWS load balancer recognises Abhushan's domain." },
      { path: "M196,210 " + TO_ABH_WEB, box: [90,590,112,52], title: "Routed to a web pod", todo: "Kubernetes, load balancer and autoscaling setup is not in the repo yet.",
        text: "The load balancer sends requests only to pods that report ready. Any web pod can take the bill. There are no sticky sessions, because the token travels with every request." },
      { path: "M146,590 L146,512", box: [90,480,112,30], title: "Who is asking?",
        text: "Spring Security validates the token. Role permissions check that this user may submit bills at this branch. Field access hides values such as cost price from roles that must not see them." },
      { path: "M146,480 L146,414", box: [90,380,172,32], title: "Store front module prices the bill", todo: "The rules engine exists. The DP blueprint and its Store front module are still to be built.",
        text: "The bill screen and its rules come from the DP blueprint, not from code. Its business rules apply today's rate from the local rate board, making charges and any scheme discount." },
      { path: "M146,412 L80,412 L80,533 L90,533", box: [90,518,112,30], title: "Tax and costing",
        text: "The tax engine works out GST on every line from the tax profile. If tax cannot be computed, the bill is refused, so a wrong voucher is never posted." },
      { path: "M202,533 L211,533", box: [211,518,112,30], title: "Stock",
        text: "The stock engine moves each sold tag out of the showroom's stock in the stock ledger, by pieces and by weight." },
      { path: "M323,533 L332,533", box: [332,518,112,30], title: "Payment",
        text: "The cash, card or UPI received is recorded and matched against the bill." },
      { path: "M444,533 L453,533", box: [453,518,112,30], title: "General ledger",
        text: "The GL engine posts a balanced sales voucher: cash or customer, sales and GST output. It reads what stock and payment have just written." },
      { path: "M146,642 L146,712 L260,712 L260,850", box: [70,852,530,88], title: "One transaction",
        text: "Tax, stock, payment and GL are saved in a single PostgreSQL transaction. If any one of them fails, nothing is saved, so stock and the ledger can never disagree." },
      { box: [70,852,530,88], title: "Replica updated",
        text: "Streaming replication copies the change to the read replica within seconds. Reports and MIS read from the replica, so they never slow the tills." },
      { path: "M260,850 L260,712 L80,712 L80,330 L450,330 L450,210 L196,210 L196,160", box: [30,90,332,70], title: "Answer back to the till",
        text: "The bill number returns to the till and the invoice prints. The audit trail and any outgoing notifications are written in the background after the save." }
    ]},
    { name: "Gold rate change",
      about: "The group owns the rates, but every bill needs them instantly. So the master service pushes each new rate to every company ahead of time.",
      steps: [
      { box: [382,90,332,70], title: "Head Office sets the rate",
        text: "Merchandising enters today's 22K and 18K rates once, for the whole group." },
      { path: "M548,160 L548,210 L1515,210 L1515,362", box: [1315,362,400,74], title: "Sent to the master service", todo: "The group master service does not exist yet.",
        text: "The group master service is the single owner of shared masters: rates, purity, items and designs." },
      { path: "M1345,790 L1345,850", box: [1280,852,220,88], title: "Saved in the group database", todo: "The group database comes with the master service.",
        text: "The rate is stored with the time it takes effect, so the full rate history is kept." },
      { path: "M1313,399 L1300,399 L1300,745 L1220,745 A10,10 0 0 0 1200,745 L700,745 L700,722", box: [70,322,760,400], title: "Pushed to Abhushan", todo: "The rate push is not built. API keys and the rate board exist.",
        text: "The master service calls Abhushan's API over HTTPS. It signs in with an API key that is allowed to write rates and nothing else." },
      { path: "M700,722 L700,712 L260,712 L260,850", box: [70,852,530,88], title: "Stored in Abhushan's rate board",
        text: "Abhushan writes the rate into its own rate board, in its own database." },
      { path: "M1313,399 L1300,399 L1300,745 L1250,745 L1250,722", box: [850,322,420,400], title: "Pushed to every company", todo: "The push and the catch-up for an unreachable company are not built.",
        text: "Kumari and the other companies receive the same push. A company that was unreachable gets the rate when it comes back." },
      { path: "M196,160 L196,210 " + TO_ABH_WEB, box: [90,590,112,52], title: "Bills read it locally",
        text: "The next bill reads the rate from Abhushan's own database and saves it on the bill. If the master service is down, the showrooms keep billing." }
    ]},
    { name: "Inter-company transfer",
      about: "Two companies means two databases, so one transaction cannot cover both. An outbox and a message broker make sure the transfer reaches both sets of books.",
      steps: [
      { box: [382,90,332,70], title: "Head Office creates the transfer",
        text: "A stock transfer from Abhushan to Kumari is entered in Abhushan." },
      { path: "M548,160 L548,210 " + TO_ABH_WEB, box: [90,590,112,52], title: "Reaches an Abhushan web pod",
        text: "It takes the same path as a bill: load balancer, login token check, permissions." },
      { path: "M146,642 L146,712 L260,712 L260,850", box: [70,852,530,88], title: "Saved together with an outbox row", todo: "The outbox is not built. Today a webhook is queued just after the save, so a crash at that moment can lose the event.",
        text: "Stock leaves Abhushan, and a row saying 'event to send' is written in the same transaction. If the server crashes now, the row is still there to send." },
      { path: "M260,850 L260,712 L818,712 L818,616 L686,616", box: [574,590,112,52], title: "Job runner picks it up", todo: "Reading the outbox is part of the outbox work. Today the job runner retries webhooks instead.",
        text: "The single job runner regularly checks the outbox table and finds events not yet sent." },
      { path: "M686,616 L818,616 L818,712 L700,712 L700,745 L1200,745 A10,10 0 0 1 1220,745 L1300,745 L1313,745", box: [1315,714,400,62], title: "Published to the broker", todo: "No message broker is set up yet.",
        text: "The event goes to the message broker (NATS JetStream, or Kafka / RabbitMQ). The broker keeps it until Kumari confirms receipt." },
      { path: "M1313,745 L1300,745 L1250,745 L1250,722", box: [850,322,420,400], title: "Delivered to Kumari", todo: "Comes with the message broker.",
        text: "Kumari's subscriber receives the transfer event." },
      { path: "M1250,722 L1250,712 L1210,712 L1210,850", box: [1040,852,220,88], title: "Draft receipt in Kumari", todo: "The receiving side and the duplicate check by event id are not built.",
        text: "Kumari creates a draft stock receipt in its own database. It checks the event id first, so a repeated delivery creates nothing new." },
      { box: [850,322,420,400], title: "Confirmed in both books", todo: "Delivery confirmation comes with the broker.",
        text: "Kumari confirms receipt and Abhushan marks the event as sent. Each company's books now show its own side of the transfer." }
    ]},
    { name: "Overnight group MIS",
      about: "Group reports need every company's numbers, but no company may read another company's database. A separate reporting service collects copies.",
      steps: [
      { box: [1315,452,400,74], title: "Extract starts", todo: "The group reporting service does not exist yet.",
        text: "A scheduled job in group reporting starts after the stores close." },
      { path: "M1313,489 L1300,489 L1300,745 L1220,745 A10,10 0 0 0 1200,745 L700,745 L700,712 L260,712 L260,850", box: [70,852,530,88], title: "Reads Abhushan's replica", todo: "The extract is not built. The read replica and the report role exist.",
        text: "It reads the day's sales, stock and trial balance from the read replica with a read-only login. It never touches the primary, so the tills are not slowed." },
      { path: "M1313,489 L1300,489 L1300,745 L1250,745 L1250,712 L1210,712 L1210,850", box: [1040,852,220,88], title: "Reads Kumari's replica", todo: "The extract is not built.",
        text: "Kumari's figures are collected the same way, and so are the other companies'." },
      { path: "M1345,790 L1345,850", box: [1280,852,220,88], title: "Facts loaded", todo: "The group facts database is not built.",
        text: "Only summarised facts are stored in the group database. They are copies and are never written back to a company." },
      { path: "M900,160 L900,210 L1515,210 L1515,452", box: [1315,452,400,74], title: "Mumbai opens the MIS", todo: "Consolidated MIS across companies is not built. Each company's own reports exist.",
        text: "Corporate sees consolidated sales, stock and trial balance across all companies, or one company at a time." }
    ]},
    { name: "Festival peak",
      about: "Only web pods scale. The job runner and the report pod stay at one each, and the database is sized ahead of time.",
      steps: [
      { box: [90,590,233,52], title: "CPU rises",
        text: "On Dhanteras, bills per minute jump. The two always-on web pods go above 65% CPU." },
      { box: [90,656,354,48], title: "The autoscaler decides", todo: "Kubernetes, load balancer and autoscaling setup is not in the repo yet.",
        text: "The Kubernetes pod autoscaler sees the CPU target exceeded and asks for more web pods, up to four." },
      { box: [332,590,233,52], scale: true, title: "New pods start", todo: "Kubernetes, load balancer and autoscaling setup is not in the repo yet.",
        text: "Web pods 3 and 4 start from the same container image as pods 1 and 2." },
      { box: [453,656,354,48], scale: true, title: "More machines if needed", todo: "Kubernetes, load balancer and autoscaling setup is not in the repo yet.",
        text: "If the EC2 nodes have no room left, Karpenter starts another node, usually within a couple of minutes." },
      { path: "M196,160 L196,210 L450,210 L450,330 L80,330 L80,562 L388,562 L388,590", box: [332,590,112,52], scale: true, title: "Traffic reaches the new pods", todo: "Kubernetes, load balancer and autoscaling setup is not in the repo yet.",
        text: "When a new pod reports ready, the load balancer adds it. Bills now spread over four pods." },
      { box: [332,590,233,52], scale: false, title: "Back to normal", todo: "Needs the autoscaling setup and graceful shutdown, neither built yet.",
        text: "When the rush ends, the autoscaler removes the extra pods after a cool-down, and each one finishes its requests first. Java pods take time to start, so raise the minimum before known festival days." }
    ]}
  ];

  const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const NS = "http://www.w3.org/2000/svg";
  const dot = document.getElementById("dot");
  const trail = document.getElementById("trail");
  const hl = document.getElementById("hl");
  const measure = document.createElementNS(NS, "path");
  const elCount = document.getElementById("count");
  const elName = document.getElementById("fname");
  const elAbout = document.getElementById("fabout");
  const elSteps = document.getElementById("steps");
  const elTodo = document.getElementById("ftodo");
  const btnPlay = document.getElementById("play");
  const flowsEl = document.getElementById("flows");
  const scalePods = Array.from(document.querySelectorAll(".scale"));

  let f = 0, s = 0, playing = true, timer = null, raf = null, built = -1;

  FLOWS.forEach((fl, i) => {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = fl.name; b.id = "flow-" + i;
    b.addEventListener("click", () => { f = i; s = 0; show(); });
    flowsEl.appendChild(b);
  });

  function buildSteps() {
    const flow = FLOWS[f];
    elName.textContent = flow.name;
    elAbout.textContent = flow.about;
    const nTodo = flow.steps.filter(x => x.todo).length;
    elTodo.textContent = nTodo === 0 ? "Every step here works today."
      : nTodo === flow.steps.length ? "Every step in this flow is still to build. It shows the design."
      : nTodo + " of " + flow.steps.length + " steps are still to build. They are marked below.";
    elSteps.innerHTML = "";
    flow.steps.forEach((st, i) => {
      const li = document.createElement("li");
      const b = document.createElement("button");
      b.type = "button";
      b.innerHTML = '<span class="n">' + (i + 1) + '</span><span class="body"><span class="tt"><b></b></span><span class="d"></span></span>';
      b.querySelector("b").textContent = st.title;
      b.querySelector(".d").textContent = st.text;
      if (st.todo) {
        const pill = document.createElement("span");
        pill.className = "tbp"; pill.textContent = "To build";
        b.querySelector(".tt").appendChild(pill);
        const note = document.createElement("span");
        note.className = "todo"; note.textContent = st.todo;
        b.querySelector(".body").appendChild(note);
        li.classList.add("is-todo");
      }
      b.addEventListener("click", () => { s = i; show(); });
      li.appendChild(b);
      elSteps.appendChild(li);
    });
    built = f;
  }

  function setScale(on) { scalePods.forEach(p => p.classList.toggle("on", on)); }

  function show() {
    clearTimeout(timer); cancelAnimationFrame(raf);
    if (built !== f) buildSteps();
    const flow = FLOWS[f], st = flow.steps[s];
    Array.from(flowsEl.children).forEach((b, i) => b.setAttribute("aria-pressed", String(i === f)));
    Array.from(elSteps.children).forEach((li, i) => {
      li.classList.toggle("cur", i === s);
      li.classList.toggle("done", i < s);
    });
    const cur = elSteps.children[s];
    if (cur) cur.scrollIntoView({ block: "nearest", behavior: reduce ? "auto" : "smooth" });
    elCount.textContent = "Flow " + (f + 1) + " of " + FLOWS.length + " · step " + (s + 1) + " of " + flow.steps.length;

    const [x, y, w, h] = st.box, pad = 5;
    hl.setAttribute("x", x - pad); hl.setAttribute("y", y - pad);
    hl.setAttribute("width", w + pad * 2); hl.setAttribute("height", h + pad * 2);
    if (typeof st.scale === "boolean") setScale(st.scale);
    else setScale(false);

    if (st.path) {
      trail.setAttribute("d", st.path);
      measure.setAttribute("d", st.path);
      const len = measure.getTotalLength();
      const dur = reduce ? 0 : Math.max(800, Math.min(2800, len * 2.4));
      const t0 = performance.now();
      const tick = now => {
        const k = dur === 0 ? 1 : Math.min(1, (now - t0) / dur);
        const e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
        const pt = measure.getPointAtLength(len * e);
        dot.setAttribute("cx", pt.x); dot.setAttribute("cy", pt.y);
        if (k < 1) raf = requestAnimationFrame(tick); else queueNext();
      };
      raf = requestAnimationFrame(tick);
    } else {
      trail.setAttribute("d", "");
      dot.setAttribute("cx", x + w / 2); dot.setAttribute("cy", y + h / 2);
      queueNext();
    }
  }

  function queueNext() {
    if (!playing) return;
    const st = FLOWS[f].steps[s];
    const last = s === FLOWS[f].steps.length - 1;
    const read = Math.max(3200, st.text.length * 45);
    timer = setTimeout(() => {
      if (last) { f = (f + 1) % FLOWS.length; s = 0; } else { s++; }
      show();
    }, last ? read + 1500 : read);
  }

  function step(d) {
    s += d;
    if (s >= FLOWS[f].steps.length) { f = (f + 1) % FLOWS.length; s = 0; }
    if (s < 0) { f = (f - 1 + FLOWS.length) % FLOWS.length; s = FLOWS[f].steps.length - 1; }
    show();
  }

  document.getElementById("next").addEventListener("click", () => step(1));
  document.getElementById("prev").addEventListener("click", () => step(-1));
  btnPlay.addEventListener("click", () => {
    playing = !playing;
    btnPlay.textContent = playing ? "Pause" : "Play";
    if (playing) queueNext(); else clearTimeout(timer);
  });
  document.addEventListener("keydown", e => {
    if (e.target.closest && e.target.closest("button") && e.key === " ") return;
    if (e.key === "ArrowRight") step(1);
    else if (e.key === "ArrowLeft") step(-1);
    else if (e.key === " ") { e.preventDefault(); btnPlay.click(); }
  });

  show();
})();
</script>


</body></html>
