<style>
/* Layout: a single full-width poster diagram; scrolls sideways below ~1500px. */
:root {
  --bg: #f4f6f9; --panel: #ffffff; --tint: #eaeff6; --region: #f0f3f8;
  --ink: #1a2130; --muted: #5a6476; --line: #c6cdd9;
  --accent: #9a6a0c; --accent-soft: #f6ecd6; --core-soft: #e3ebf7; --core-line: #6d86ad;
  --warn: #9a5b12; --warn-soft: #f7ead8; --ai: #6b4fa8; --ai-soft: #ece6f7;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f131a; --panel: #171c26; --tint: #131925; --region: #121720; --ink: #e5e8ee; --muted: #9ba4b5; --line: #343d4e;
    --accent: #dcae4d; --accent-soft: #33290f; --core-soft: #1a2436; --core-line: #7e9bc8; --warn: #e2a35a; --warn-soft: #2e2313; --ai: #b49de8; --ai-soft: #251e36; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f131a; --panel: #171c26; --tint: #131925; --region: #121720; --ink: #e5e8ee; --muted: #9ba4b5; --line: #343d4e;
  --accent: #dcae4d; --accent-soft: #33290f; --core-soft: #1a2436; --core-line: #7e9bc8; --warn: #e2a35a; --warn-soft: #2e2313; --ai: #b49de8; --ai-soft: #251e36; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 8px;
}
.wrap { height: 100%; width: 100%; display: flex; align-items: center; justify-content: center; }
svg { display: block; width: 100%; height: 100%; color: var(--muted); }
.t { fill: var(--ink); font-family: var(--body); font-size: 13px; }
.tb { fill: var(--ink); font-family: var(--body); font-size: 14.5px; font-weight: 600; }
.ts { fill: var(--muted); font-family: var(--body); font-size: 12px; }
.tl { fill: var(--muted); font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; }
.ta { fill: var(--muted); font-family: var(--body); font-size: 11.5px; }
.title { fill: var(--ink); font-family: var(--display); font-size: 26px; font-weight: 600; }
.reg { fill: var(--region); stroke: var(--line); stroke-width: 1.4; stroke-dasharray: 2 4; }
.eks { fill: var(--tint); stroke: var(--line); stroke-width: 1.4; }
.ns { fill: var(--panel); stroke: var(--ink); stroke-width: 1.4; }
.box { fill: var(--panel); stroke: var(--line); stroke-width: 1.2; }
.mod { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1; }
.core { fill: var(--core-soft); stroke: var(--core-line); stroke-width: 1; }
.ai { fill: var(--ai-soft); stroke: var(--ai); stroke-width: 1; }
.aiplan { fill: var(--ai-soft); stroke: var(--ai); stroke-width: 1.2; stroke-dasharray: 6 4; }
.db { fill: var(--bg); stroke: var(--line); stroke-width: 1.2; }
.plan { fill: var(--panel); stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 6 4; }
.ln { stroke: currentColor; stroke-width: 1.5; fill: none; }
.ln.dash { stroke-dasharray: 6 4; }
.ln.bus { stroke: var(--ink); stroke-width: 2.4; }
.mk { fill: currentColor; }
.pkt { fill: var(--accent); stroke: var(--panel); stroke-width: 2; }
.trail { fill: none; stroke: var(--accent); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; opacity: 0.55; }
.hl { fill: var(--accent); fill-opacity: 0.08; stroke: var(--accent); stroke-width: 3; animation: hl-pulse 1.4s ease-in-out infinite; }
@keyframes hl-pulse { 50% { stroke-opacity: 0.35; } }
.scale { opacity: 0.3; transition: opacity 0.8s ease; }
.scale.on { opacity: 1; }

/* Page: diagram on top, step bar below */
body { display: flex; flex-direction: column; gap: 8px; }
.wrap { flex: 1; min-height: 0; height: auto; }
.bar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px;
}
.flows { display: flex; flex-wrap: wrap; gap: 6px; }
.flows button, .ctl button {
  font: 500 13px var(--body); color: var(--ink); background: var(--bg); border: 1px solid var(--line);
  border-radius: 999px; padding: 5px 12px; cursor: pointer;
}
.flows button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--panel); }
.flows button:focus-visible, .ctl button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.step { flex: 1; min-width: 260px; display: grid; gap: 2px; }
.step .count { font: 11px var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); }
.step .text { font-size: 15px; color: var(--ink); }
.ctl { display: flex; gap: 6px; }
@media (prefers-reduced-motion: reduce) { .hl { animation: none; } }

/* Layout: explanation panel on the left, diagram on the right */
body { display: block; }
.layout { display: flex; gap: 14px; height: 100%; }
.wrap { flex: 1; min-width: 0; height: 100%; }
.side {
  width: clamp(230px, 17vw, 270px); flex: none; height: 100%; display: flex; flex-direction: column; gap: 10px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.side-head { display: grid; gap: 4px; }
.side-head .count { font: 9px var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); }
.side-head h2 { margin: 0; font: 600 15px/1.2 var(--display); color: var(--ink); text-wrap: balance; }
.side-head p { margin: 0; font-size: 11.5px; line-height: 1.45; color: var(--muted); }
.steps { list-style: none; margin: 0; padding: 0 4px 0 0; flex: 1; min-height: 0; overflow-y: auto; display: grid; gap: 4px; align-content: start; }
.steps button {
  width: 100%; text-align: left; display: grid; grid-template-columns: 18px 1fr; gap: 7px;
  background: none; border: 1px solid transparent; border-radius: 7px; padding: 5px; cursor: pointer; color: var(--ink); font: inherit;
}
.steps button:hover { background: var(--bg); }
.steps button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.steps .n {
  width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center;
  font: 9.5px var(--mono); color: var(--muted); border: 1px solid var(--line); background: var(--bg);
}
.steps .body { display: grid; gap: 3px; min-width: 0; }
.steps b { font-size: 11.5px; font-weight: 600; color: var(--ink); }
.steps .d { font-size: 11px; line-height: 1.45; color: var(--muted); }
.steps li:not(.cur) .d { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
.steps li.done .n { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.steps li.cur button { background: var(--accent-soft); border-color: var(--accent); }
.steps li.cur .n { background: var(--accent); border-color: var(--accent); color: var(--panel); }
.steps li.cur .d { color: var(--ink); }
.side .ctl { display: flex; gap: 6px; }
.side .ctl button { flex: 1; }
.side .flows button { font-size: 10.5px; padding: 2px 7px; }
.side .ctl button { font-size: 11px; padding: 3px 6px; }
.wrap { position: relative; }
.wrap svg.grab { cursor: grab; } .wrap svg.grabbing { cursor: grabbing; }
.mode { position: absolute; bottom: 10px; right: 54px; z-index: 2; display: flex; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 3px; box-shadow: 0 2px 6px rgb(0 0 0 / 0.15); }
.mode button { font: 500 12px var(--body); color: var(--muted); background: none; border: 0; border-radius: 999px; padding: 4px 12px; cursor: pointer; }
.mode button[aria-pressed="true"] { background: var(--accent); color: var(--panel); }
.mode button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
body.static .side { display: none; }
body.static .leg-step { display: none; }
/* Static: fill the width and let the page scroll down */
body.static { overflow-y: auto; overflow-x: hidden; }
body.static .layout { height: auto; }
body.static .wrap { height: auto; display: block; }
body.static .wrap svg { width: 100%; height: auto; }
body.static .zoom, body.static .mode { position: fixed; }
body.static .zoom { right: 26px; bottom: 18px; }
body.static .mode { right: 70px; bottom: 18px; }
body.static #dot, body.static #trail, body.static #hl { display: none; }
.zoom { position: absolute; right: 10px; bottom: 10px; display: flex; flex-direction: column; gap: 4px; }
.zoom button { width: 34px; height: 34px; font: 600 18px/1 var(--body); color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; cursor: pointer; box-shadow: 0 2px 6px rgb(0 0 0 / 0.15); }
.zoom button.fit { font-size: 10.5px; font-weight: 500; }
.zoom button:hover { border-color: var(--accent); }
.zoom button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#cam[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
@media (max-width: 900px) {
  body { overflow: auto; }
  .layout { flex-direction: column; height: auto; }
  .side { width: auto; height: auto; }
  .wrap { width: 100%; }
  .steps { max-height: 320px; }
  .wrap { height: 70vh; }
}
.steps .tt { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.tbp { font: 8.5px var(--mono); letter-spacing: 0.04em; text-transform: uppercase; color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn); border-radius: 999px; padding: 0 7px; }
.steps .todo { display: none; font-size: 10.5px; line-height: 1.45; color: var(--warn); border-left: 2px solid var(--warn); padding-left: 8px; margin-top: 2px; }
.steps li.cur .todo { display: block; }
.side-head .ftodo { font-size: 10.5px; color: var(--warn); }
</style>

      { path: "M1313,405 L1300,405 " + GROUP_TO_ABH + " L700,772", box: ABH_NS, title: "Pushed to Abhushan", todo: "The rate push is not built. API keys and the rate board exist.",
        text: "The master service calls Abhushan's API over HTTPS. It signs in with an API key that is allowed to write rates and nothing else." },
      { path: "M700,772 L700,762 L150,762 L150,966", box: ABH_PRI, title: "Stored in Abhushan's rate board",
        text: "Abhushan writes the rate into its own rate board, in its own primary database." },
      { path: "M1313,405 L1300,405 L1300,795 L1250,795 L1250,772", box: KUM_NS, title: "Pushed to every company", todo: "The push and the catch-up for an unreachable company are not built.",
        text: "Kumari and the other companies receive the same push. A company that was unreachable gets the rate when it comes back." },
      { path: "M196,160 L196,210 " + TO_ABH_WEB, box: WEB1, title: "Bills read it locally",
        text: "The next bill reads the rate from Abhushan's own database and saves it on the bill. If the master service is down, the showrooms keep billing." }
    ]},
    { name: "Inter-company transfer",
      about: "Two companies means two databases, so one transaction cannot cover both. An outbox and a message broker make sure the transfer reaches both sets of books.",
      steps: [
      { box: [382,90,332,70], title: "Head Office creates the transfer",
        text: "A stock transfer from Abhushan to Kumari is entered in Abhushan." },
      { path: "M548,160 L548,210 " + TO_ABH_WEB, box: WEB1, title: "Reaches an Abhushan web pod",
        text: "It takes the same path as a bill: load balancer, login token check, permissions." },
      { path: "M146,692 L146,764 L150,764 L150,966", box: ABH_PRI, title: "Saved together with an outbox row", todo: "The outbox is not built. Today a webhook is queued just after the save, so a crash at that moment can lose the event.",
        text: "Stock leaves Abhushan, and a row saying 'event to send' is written in the same transaction. If the server crashes now, the row is still there to send." },
      { path: "M150,966 L150,762 L818,762 L818,666 L686,666", box: [574,640,112,52], title: "Job runner picks it up", todo: "Reading the outbox is part of the outbox work. Today the job runner retries webhooks instead.",
        text: "The single job runner regularly checks the outbox table and finds events not yet sent." },
      { path: "M686,666 L818,666 L818,762 L700,762 " + LANE_TO_GROUP + " L1313,795", box: [1315,762,400,66], title: "Published to the broker", todo: "No message broker is set up yet.",
        text: "The event goes to the message broker (NATS JetStream, or Kafka / RabbitMQ). The broker keeps it until Kumari confirms receipt." },
      { path: "M1313,795 L1300,795 L1250,795 L1250,772", box: KUM_NS, title: "Delivered to Kumari", todo: "Comes with the message broker.",
        text: "Kumari's subscriber receives the transfer event." },
      { path: "M1250,772 L1250,762 L912,762 L912,966", box: KUM_PRI, title: "Draft receipt in Kumari", todo: "The receiving side and the duplicate check by event id are not built.",
        text: "Kumari creates a draft stock receipt in its own primary database. It checks the event id first, so a repeated delivery creates nothing new." },
      { box: KUM_NS, title: "Confirmed in both books", todo: "Delivery confirmation comes with the broker.",
        text: "Kumari confirms receipt and Abhushan marks the event as sent. Each company's books now show its own side of the transfer." }
    ]},
    { name: "Overnight group MIS",
      about: "Group reports need every company's numbers, but no company may read another company's database. A separate reporting service collects copies.",
      steps: [
      { box: [1315,450,400,66], title: "Extract starts", todo: "The group reporting service does not exist yet.",
        text: "A scheduled job in group reporting starts after the stores close." },
      { path: "M1313,483 L1300,483 " + GROUP_TO_ABH + " L600,795 L600,966", box: [535,968,130,76], title: "Reads Abhushan's second replica", todo: "The extract and the second replica are not set up. The first replica and the report role exist.",
        text: "It reads the day's sales, stock and trial balance from a replica kept for MIS, with a read-only login. The tills' primary and the report pod's replica are never touched." },
      { path: "M1313,483 L1300,483 L1300,795 L782,795 L782,966", box: [725,968,115,76], title: "Reads Kumari's replica", todo: "The extract is not built.",
        text: "Kumari's figures are collected the same way, and so are the other companies'." },
      { path: "M1655,842 L1655,966", box: [1595,968,120,76], title: "Facts loaded", todo: "The group facts database is not built.",
        text: "Only summarised facts are stored, on their own instance, apart from the masters. They are copies and are never written back to a company." },
      { path: "M900,160 L900,210 L1515,210 L1515,450", box: [1315,450,400,66], title: "Mumbai opens the MIS", todo: "Consolidated MIS across companies is not built. Each company's own reports exist.",
        text: "Corporate sees consolidated sales, stock and trial balance across all companies, or one company at a time." }
    ]},
    { name: "Ask your data (AI)",
      about: "A user asks a question in plain words. The AI layer picks a governed metric or report and runs it with the user's own permissions. It never writes SQL, and the language model only writes the explanation.",
      steps: [
      { box: [734,90,332,70], title: "Question typed",
        text: "Someone in Mumbai finance types: \"Dhanteras sales by showroom vs last year\"." },
      { path: "M900,160 L900,210 " + TO_ABH_WEB, box: WEB1, title: "Reaches an Abhushan web pod",
        text: "Same path as any request: load balancer, login token check, permissions." },
      { path: "M146,640 L146,612", box: [90,580,172,30], title: "Matched to a governed metric", todo: "The resolver exists. DP's own metrics and reports still need to be defined in its blueprint.",
        text: "The question is matched against the metrics and reports this user may open. Embeddings help the match; the period and comparison are read by fixed rules, not by a model. The user sees \"what I understood\"." },
      { path: "M262,595 L267,595 L267,566 L630,566 L630,548", box: [574,518,112,30], title: "Runs through the report engine",
        text: "The chosen metric runs exactly as if the user had opened the report: same role permissions, same field access, same branch scope. The AI cannot show a number the user could not see." },
      { path: "M630,548 L630,566 L722,566 L722,580", box: [636,580,172,30], title: "Narration asked for",
        text: "Only the question and the result figures are sent onward for a short written summary. This step is optional: without it, the user still gets the numbers and the chart." },
      { path: "M808,595 L818,595 L818,762 L700,762 " + LANE_TO_GROUP + " L1300,561 L1313,561", box: [1315,528,400,66], title: "AI gateway writes the summary", todo: "The language model slot exists (OpenAI-compatible, works with Ollama). The shared gateway is not deployed.",
        text: "The gateway runs the language model inside AWS Mumbai, on a GPU node or through Amazon Bedrock. It keeps nothing, and it never sees the database." },
      { path: "M1313,561 L1300,561 " + GROUP_TO_ABH + " L700,762 L80,762 L80,330 L450,330 L450,210 L900,210 L900,160", box: [734,90,332,70], title: "Answer on screen",
        text: "The user sees the figures, a chart and the summary, with a link to open the report behind it." }
    ]},
    { name: "Festival peak",
      about: "Only web pods scale. The job runner and the report pod stay at one each, and the database is sized ahead of time.",
      steps: [
      { box: [90,640,233,52], title: "CPU rises",
        text: "On Dhanteras, bills per minute jump. The two always-on web pods go above 65% CPU." },
      { box: [90,706,354,48], title: "The autoscaler decides", todo: "Kubernetes, load balancer and autoscaling setup is not in the repo yet.",
        text: "The Kubernetes pod autoscaler sees the CPU target exceeded and asks for more web pods, up to four." },
      { box: [332,640,233,52], scale: true, title: "New pods start", todo: "Kubernetes, load balancer and autoscaling setup is not in the repo yet.",
        text: "Web pods 3 and 4 start from the same container image as pods 1 and 2." },
      { box: [453,706,354,48], scale: true, title: "More machines if needed", todo: "Kubernetes, load balancer and autoscaling setup is not in the repo yet.",
        text: "If the EC2 nodes have no room left, Karpenter starts another node, usually within a couple of minutes." },
      { path: "M196,160 L196,210 L450,210 L450,330 L80,330 L80,618 L388,618 L388,640", box: [332,640,112,52], scale: true, title: "Traffic reaches the new pods", todo: "Kubernetes, load balancer and autoscaling setup is not in the repo yet.",
        text: "When a new pod reports ready, the load balancer adds it. Bills now spread over four pods." },
      { path: "M388,692 L388,764 L150,764 L150,930", box: [85,930,280,26], scale: true, title: "Database connections stay in limit", todo: "RDS Proxy is optional and not set up.",
        text: "Every new pod opens its own connection pool. RDS Proxy shares a smaller set of database connections between all the pods, so adding pods cannot exhaust the primary. The database itself is sized before the season." },
      { box: [332,640,233,52], scale: false, title: "Back to normal", todo: "Needs the autoscaling setup and graceful shutdown, neither built yet.",
        text: "When the rush ends, the autoscaler removes the extra pods after a cool-down, and each one finishes its requests first. Java pods take time to start, so raise the minimum before known festival days." }
    ]}
  ];

  const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const NS = "http://www.w3.org/2000/svg";
  const dot = document.getElementById("dot");
  const trail = document.getElementById("trail");
  const hl = document.getElementById("hl");
  const measure = document.createElementNS(NS, "path");
  const elCount = document.getElementById("count");
  const elName = document.getElementById("fname");
  const elAbout = document.getElementById("fabout");
  const elSteps = document.getElementById("steps");
  const elTodo = document.getElementById("ftodo");
  const btnPlay = document.getElementById("play");
  const flowsEl = document.getElementById("flows");
  const scalePods = Array.from(document.querySelectorAll(".scale"));

  let f = 0, s = 0, playing = true, timer = null, raf = null, built = -1;
  const svg = document.querySelector(".wrap svg");
  const FULL = [0, 0, 1800, 1260];
  let view = FULL.slice(), camRaf = null, follow = true, isStatic = false;
  const btnCam = document.getElementById("cam");

  function setView(v) { view = v; svg.setAttribute("viewBox", v.map(n => n.toFixed(1)).join(" ")); }
  function targetFor(st) {
    if (!follow || isStatic) return FULL.slice();
    let [x0, y0, w, h] = st.box, x1 = x0 + w, y1 = y0 + h;
    if (st.path) {
      const b = trail.getBBox();
      x0 = Math.min(x0, b.x); y0 = Math.min(y0, b.y);
      x1 = Math.max(x1, b.x + b.width); y1 = Math.max(y1, b.y + b.height);
    }
    const pad = 70;
    x0 -= pad; y0 -= pad; x1 += pad; y1 += pad;
    const r = svg.getBoundingClientRect();
    const aspect = r.width > 0 && r.height > 0 ? r.width / r.height : FULL[2] / FULL[3];
    const tw = x1 - x0, th = y1 - y0;
    let cw = Math.max(tw, 760), ch = Math.max(th, 420);
    if (cw / ch < aspect) cw = ch * aspect; else ch = cw / aspect;
    if (cw > FULL[2]) { cw = FULL[2]; ch = cw / aspect; }
    if (ch < th - 2 * pad + 20 || ch >= FULL[3]) return FULL.slice();
    let cx = (x0 + x1) / 2 - cw / 2, cy = (y0 + y1) / 2 - ch / 2;
    cx = Math.min(Math.max(cx, 0), FULL[2] - cw);
    cy = Math.min(Math.max(cy, 0), FULL[3] - ch);
    return [cx, cy, cw, ch];
  }
  function moveCamera(st) {
    cancelAnimationFrame(camRaf);
    const to = targetFor(st), from = view.slice();
    if (reduce) { setView(to); return; }
    const t0 = performance.now(), dur = 750;
    const tick = now => {
      const k = Math.max(0, Math.min(1, (now - t0) / dur));
      const e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
      setView(from.map((v, i) => v + (to[i] - v) * e));
      if (k < 1) camRaf = requestAnimationFrame(tick);
    };
    camRaf = requestAnimationFrame(tick);
  }
  btnCam.addEventListener("click", () => {
    follow = !follow;
    btnCam.setAttribute("aria-pressed", String(follow));
    btnCam.textContent = follow ? "Zoom to step" : "Full map";
    moveCamera(FLOWS[f].steps[s]);
  });
  window.addEventListener("resize", () => setView(targetFor(FLOWS[f].steps[s])));

  function manual() {
    if (follow) { follow = false; btnCam.setAttribute("aria-pressed", "false"); btnCam.textContent = "Full map"; }
    cancelAnimationFrame(camRaf);
  }
  function clampView(v) {
    let [x, y, w, h] = v;
    const r = svg.getBoundingClientRect(), aspect = r.width / r.height || 1.43;
    w = Math.min(Math.max(w, 300), FULL[2] * 1.6); h = w / aspect;
    x = Math.min(Math.max(x, -w * 0.3), FULL[2] - w * 0.7);
    y = Math.min(Math.max(y, -h * 0.3), FULL[3] - h * 0.7);
    return [x, y, w, h];
  }
  function zoomBy(k) {
    manual();
    const [x, y, w, h] = view, cx = x + w / 2, cy = y + h / 2;
    const r = svg.getBoundingClientRect(), aspect = r.width / r.height || 1.43;
    const nw = w * k, nh = nw / aspect;
    setView(clampView([cx - nw / 2, cy - nh / 2, nw, nh]));
  }
  document.getElementById("zin").addEventListener("click", () => zoomBy(0.75));
  document.getElementById("zout").addEventListener("click", () => zoomBy(1 / 0.75));
  document.getElementById("zfit").addEventListener("click", () => { manual(); setView(FULL.slice()); });

  // drag to pan
  svg.classList.add("grab");
  let drag = null;
  svg.addEventListener("pointerdown", e => {
    if (e.button !== 0) return;
    drag = { x: e.clientX, y: e.clientY, v: view.slice(), moved: false };
    svg.setPointerCapture(e.pointerId);
  });
  svg.addEventListener("pointermove", e => {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!drag.moved && Math.hypot(dx, dy) < 4) return;
    if (!drag.moved) { drag.moved = true; manual(); svg.classList.add("grabbing"); }
    const r = svg.getBoundingClientRect();
    const scale = Math.max(drag.v[2] / r.width, drag.v[3] / r.height);
    setView(clampView([drag.v[0] - dx * scale, drag.v[1] - dy * scale, drag.v[2], drag.v[3]]));
  });
  const endDrag = () => { drag = null; svg.classList.remove("grabbing"); };
  svg.addEventListener("pointerup", endDrag);
  svg.addEventListener("pointercancel", endDrag);
  document.addEventListener("keydown", e => {
    if (e.key === "+" || e.key === "=") zoomBy(0.75);
    else if (e.key === "-" || e.key === "_") zoomBy(1 / 0.75);
  });

  FLOWS.forEach((fl, i) => {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = fl.name; b.id = "flow-" + i;
    b.addEventListener("click", () => { f = i; s = 0; show(); });
    flowsEl.appendChild(b);
  });

  function buildSteps() {
    const flow = FLOWS[f];
    elName.textContent = flow.name;
    elAbout.textContent = flow.about;
    const nTodo = flow.steps.filter(x => x.todo).length;
    elTodo.textContent = nTodo === 0 ? "Every step here works today."
      : nTodo === flow.steps.length ? "Every step in this flow is still to build. It shows the design."
      : nTodo + " of " + flow.steps.length + " steps are still to build. They are marked below.";
    elSteps.innerHTML = "";
    flow.steps.forEach((st, i) => {
      const li = document.createElement("li");
      const b = document.createElement("button");
      b.type = "button";
      b.innerHTML = '<span class="n">' + (i + 1) + '</span><span class="body"><span class="tt"><b></b></span><span class="d"></span></span>';
      b.querySelector("b").textContent = st.title;
      b.querySelector(".d").textContent = st.text;
      if (st.todo) {
        const pill = document.createElement("span");
        pill.className = "tbp"; pill.textContent = "To build";
        b.querySelector(".tt").appendChild(pill);
        const note = document.createElement("span");
        note.className = "todo"; note.textContent = st.todo;
        b.querySelector(".body").appendChild(note);
        li.classList.add("is-todo");
      }
      b.addEventListener("click", () => { s = i; show(); });
      li.appendChild(b);
      elSteps.appendChild(li);
    });
    built = f;
  }

  function setScale(on) { scalePods.forEach(p => p.classList.toggle("on", on)); }

  function show() {
    clearTimeout(timer); cancelAnimationFrame(raf);
    if (built !== f) buildSteps();
    const flow = FLOWS[f], st = flow.steps[s];
    Array.from(flowsEl.children).forEach((b, i) => b.setAttribute("aria-pressed", String(i === f)));
    Array.from(elSteps.children).forEach((li, i) => {
      li.classList.toggle("cur", i === s);
      li.classList.toggle("done", i < s);
    });
    const cur = elSteps.children[s];
    if (cur) cur.scrollIntoView({ block: "nearest", behavior: reduce ? "auto" : "smooth" });
    elCount.textContent = "Flow " + (f + 1) + " of " + FLOWS.length + " · step " + (s + 1) + " of " + flow.steps.length;

    const [x, y, w, h] = st.box, pad = 5;
    hl.setAttribute("x", x - pad); hl.setAttribute("y", y - pad);
    hl.setAttribute("width", w + pad * 2); hl.setAttribute("height", h + pad * 2);
    if (typeof st.scale === "boolean") setScale(st.scale);
    else setScale(false);

    if (st.path) {
      trail.setAttribute("d", st.path);
      measure.setAttribute("d", st.path);
      moveCamera(st);
      const len = measure.getTotalLength();
      const dur = reduce ? 0 : Math.max(800, Math.min(2800, len * 2.4));
      const t0 = performance.now();
      const tick = now => {
        const k = dur === 0 ? 1 : Math.max(0, Math.min(1, (now - t0) / dur));
        const e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
        const pt = measure.getPointAtLength(len * e);
        dot.setAttribute("cx", pt.x); dot.setAttribute("cy", pt.y);
        if (k < 1) raf = requestAnimationFrame(tick); else queueNext();
      };
      raf = requestAnimationFrame(tick);
    } else {
      trail.setAttribute("d", "");
      moveCamera(st);
      dot.setAttribute("cx", x + w / 2); dot.setAttribute("cy", y + h / 2);
      queueNext();
    }
  }

  function queueNext() {
    if (!playing || isStatic) return;
    const st = FLOWS[f].steps[s];
    const last = s === FLOWS[f].steps.length - 1;
    const read = Math.max(3200, st.text.length * 45);
    timer = setTimeout(() => {
      if (last) { f = (f + 1) % FLOWS.length; s = 0; } else { s++; }
      show();
    }, last ? read + 1500 : read);
  }

  function step(d) {
    s += d;
    if (s >= FLOWS[f].steps.length) { f = (f + 1) % FLOWS.length; s = 0; }
    if (s < 0) { f = (f - 1 + FLOWS.length) % FLOWS.length; s = FLOWS[f].steps.length - 1; }
    show();
  }

  document.getElementById("next").addEventListener("click", () => step(1));
  document.getElementById("prev").addEventListener("click", () => step(-1));
  btnPlay.addEventListener("click", () => {
    playing = !playing;
    btnPlay.textContent = playing ? "Pause" : "Play";
    if (playing) queueNext(); else clearTimeout(timer);
  });
  document.addEventListener("keydown", e => {
    if (isStatic) return;
    if (e.target.closest && e.target.closest("button") && e.key === " ") return;
    if (e.key === "ArrowRight") step(1);
    else if (e.key === "ArrowLeft") step(-1);
    else if (e.key === " ") { e.preventDefault(); btnPlay.click(); }
  });

  const btnInt = document.getElementById("m-int"), btnSta = document.getElementById("m-sta");
  function setMode(m, save) {
    isStatic = m === "static";
    document.body.classList.toggle("static", isStatic);
    btnInt.setAttribute("aria-pressed", String(!isStatic));
    btnSta.setAttribute("aria-pressed", String(isStatic));
    if (save) { try { localStorage.setItem("dp-map-mode", m); } catch (e) {} }
    if (isStatic) {
      clearTimeout(timer); cancelAnimationFrame(raf); cancelAnimationFrame(camRaf);
      setScale(false);
      requestAnimationFrame(() => setView(FULL.slice()));
    } else {
      follow = true; btnCam.setAttribute("aria-pressed", "true"); btnCam.textContent = "Zoom to step";
      requestAnimationFrame(() => { setView(FULL.slice()); show(); });
    }
  }
  btnInt.addEventListener("click", () => setMode("interactive", true));
  btnSta.addEventListener("click", () => setMode("static", true));
  let saved = null;
  try { saved = localStorage.getItem("dp-map-mode"); } catch (e) {}
  setMode(saved === "static" ? "static" : "interactive", false);
})();
</script>
